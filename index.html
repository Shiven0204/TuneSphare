<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EchoVerse is a modern music discovery interface built with vanilla web technologies."
    />
    <title>EchoVerse | Find your next sound</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-row">
          <a class="brand" href="#home" aria-label="EchoVerse home">
            <span class="brand-mark" aria-hidden="true">EV</span>
            <span>EchoVerse</span>
          </a>
          <button
            class="icon-button sidebar-close"
            type="button"
            aria-label="Close navigation"
            data-nav-close
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <nav class="primary-nav" aria-label="Primary navigation">
          <p class="nav-label">Explore</p>
          <a class="nav-link is-active" href="#home" data-view="all">
            <span class="nav-icon" aria-hidden="true">⌂</span>Home
          </a>
          <a class="nav-link" href="#songs-title" data-view="all">
            <span class="nav-icon" aria-hidden="true">♫</span>Songs
          </a>
          <a class="nav-link" href="#library" data-view="library">
            <span class="nav-icon" aria-hidden="true">▣</span>Library
          </a>
          <a class="nav-link" href="#liked-songs" data-view="liked">
            <span class="nav-icon" aria-hidden="true">♡</span>Liked Songs
          </a>
          <a class="nav-link" href="#recently-played" data-view="recent">
            <span class="nav-icon" aria-hidden="true">◷</span>Recently Played
          </a>
        </nav>

        <div class="sidebar-note">
          <span class="note-dot" aria-hidden="true"></span>
          <div>
            <strong>Local music</strong>
            <span>Three songs ready to play.</span>
          </div>
        </div>
      </aside>

      <div class="page-area">
        <header class="topbar">
          <button
            class="icon-button menu-button"
            type="button"
            aria-label="Open navigation"
            aria-controls="sidebar"
            aria-expanded="false"
            data-nav-open
          >
            <span aria-hidden="true">☰</span>
          </button>
          <div class="title-block">
            <span class="eyebrow">EchoVerse</span>
            <h1>Local songs</h1>
          </div>
          <form class="search-form" role="search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label class="sr-only" for="song-search">Search songs</label>
            <input
              id="song-search"
              type="search"
              placeholder="Search songs or artists"
              autocomplete="off"
            />
          </form>
        </header>

        <main class="main-content" id="home">
          <section
            class="content-section popular-section"
            aria-labelledby="songs-title"
          >
            <div class="section-heading">
              <div>
                <span class="eyebrow">Available in the music folder</span>
                <h2 id="songs-title">Songs</h2>
              </div>
            </div>
            <div class="track-list" aria-live="polite"></div>
          </section>
          <section
            class="library-overview"
            id="library"
            aria-label="Library"
            hidden
          >
            <div class="library-group">
              <div class="section-heading"><h2>Liked Songs</h2></div>
              <div
                class="track-list library-liked-list"
                aria-live="polite"
              ></div>
            </div>
            <div class="library-group">
              <div class="section-heading"><h2>Recently Played</h2></div>
              <div
                class="track-list library-recent-list"
                aria-live="polite"
              ></div>
            </div>
            <div class="library-group">
              <div class="section-heading"><h2>All Songs</h2></div>
              <div class="track-list library-all-list" aria-live="polite"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <footer class="player-bar" aria-label="Music player">
      <audio id="audio-player" preload="metadata"></audio>

      <div class="now-playing">
        <div class="player-art artwork-static"><span>BR</span></div>
        <div class="now-playing-copy">
          <strong>Barsaat</strong><span>Banjaare &amp; Roni</span>
        </div>
      </div>
      <div class="player-controls">
        <div class="control-buttons">
          <button class="icon-button" type="button" aria-label="Previous track">
            ◀◀</button
          ><button class="play-button" type="button" aria-label="Play track">
            ▶</button
          ><button class="icon-button" type="button" aria-label="Next track">
            ▶▶
          </button>
        </div>
        <div class="progress-row">
          <span class="time-current">0:00</span>
          <div
            class="progress-track"
            role="slider"
            tabindex="0"
            aria-label="Playback position"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-valuetext="0:00"
          >
            <span class="progress-value"></span>
          </div>
          <span class="time-total">0:00</span>
        </div>
      </div>
      <div class="player-options">
        <span class="volume-icon" aria-hidden="true">⌁</span
        ><label class="sr-only" for="volume">Volume</label
        ><input id="volume" type="range" min="0" max="100" value="68" />
      </div>
    </footer>
  </body>
</html>
